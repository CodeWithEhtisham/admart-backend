openapi: 3.0.3
info:
  title: Admart API
  version: 1.0.0
  description: Admart Authentication & Video Publishing Platform Backend API
paths:
  /api/admin/payments:
    get:
      operationId: admin_payments_retrieve
      description: GET /api/admin/payments — payment list (staff); POST (superuser)
        manual entry.
      summary: List payments for admin
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: admin_payments_create
      description: GET /api/admin/payments — payment list (staff); POST (superuser)
        manual entry.
      summary: Record a manual payment
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/payments/{payment_id}/review:
    post:
      operationId: admin_payments_review_create
      description: POST /api/admin/payments/{id}/review — approve or reject a pending
        payment.
      summary: Approve or reject a pending manual payment
      parameters:
      - in: path
        name: payment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/plans:
    get:
      operationId: admin_plans_retrieve
      description: GET /api/admin/plans — plan definitions with subscriber counts.
      summary: Superadmin plan definitions
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/plans/{plan_id}:
    put:
      operationId: admin_plans_update
      description: PUT/DELETE /api/admin/plans/<plan_id> — edit or delete a plan.
      summary: Update a plan definition
      parameters:
      - in: path
        name: plan_id
        schema:
          type: string
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: admin_plans_destroy
      description: PUT/DELETE /api/admin/plans/<plan_id> — edit or delete a plan.
      summary: Delete a plan definition
      parameters:
      - in: path
        name: plan_id
        schema:
          type: string
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/admin/plans/create:
    post:
      operationId: admin_plans_create_create
      description: POST /api/admin/plans — create a new plan.
      summary: Create a new plan
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/revenue:
    get:
      operationId: admin_revenue_retrieve
      description: GET /api/admin/revenue — payment and subscription revenue summary.
      summary: Superadmin revenue summary
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/settings:
    get:
      operationId: admin_settings_retrieve
      description: |-
        GET /api/admin/settings — app settings + platform status (staff).

        PUT (superuser) persists editable settings via the AdminSetting key/value store.
      summary: Read admin settings and platform status
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: admin_settings_update
      description: |-
        GET /api/admin/settings — app settings + platform status (staff).

        PUT (superuser) persists editable settings via the AdminSetting key/value store.
      summary: Update admin settings
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/stats:
    get:
      operationId: admin_stats_retrieve
      description: GET /api/admin/stats — overview KPIs, charts, and recent activity.
      summary: Superadmin overview statistics
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/usage:
    get:
      operationId: admin_usage_retrieve
      description: GET /api/admin/usage — detailed job/credit usage breakdown.
      summary: Superadmin usage breakdown
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/users:
    get:
      operationId: admin_users_retrieve
      description: |-
        GET /api/admin/users — paginated, filterable customer list.

        POST (superuser) creates a customer account manually.
      summary: List customers for admin
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: admin_users_create
      description: |-
        GET /api/admin/users — paginated, filterable customer list.

        POST (superuser) creates a customer account manually.
      summary: Create a customer account manually
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/users/{user_id}:
    get:
      operationId: admin_users_retrieve_2
      description: GET/PATCH/DELETE /api/admin/users/{id} — customer detail, support
        actions, delete.
      summary: Customer detail for admin
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: admin_users_partial_update
      description: GET/PATCH/DELETE /api/admin/users/{id} — customer detail, support
        actions, delete.
      summary: Update customer support fields
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: admin_users_destroy
      description: GET/PATCH/DELETE /api/admin/users/{id} — customer detail, support
        actions, delete.
      summary: Delete a customer account
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/admin/users/{user_id}/credits:
    post:
      operationId: admin_users_credits_create
      description: POST /api/admin/users/{id}/credits — grant or deduct credits (audited).
      summary: Adjust a customer's credits
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/users/{user_id}/plan:
    post:
      operationId: admin_users_plan_create
      description: POST /api/admin/users/{id}/plan — change plan + optional credit
        reset/top-up.
      summary: Change a customer's plan
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/ads/callback/{provider}:
    get:
      operationId: ads_callback_retrieve
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - ads
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/forgot-password:
    post:
      operationId: auth_forgot_password_create
      description: Find user, generate secure signed token, and simulate email delivery.
      summary: Forgot password request
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/auth/google:
    post:
      operationId: auth_google_create
      description: Exchange a Google auth code (or id_token) for Admart JWT.
      summary: Google OAuth Callback Exchange
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuth'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleAuth'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleAuth'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/auth/login:
    post:
      operationId: auth_login_create
      description: Custom Login View returning camelCase tokens and user profile.
      summary: Login with email and password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/auth/logout:
    post:
      operationId: auth_logout_create
      description: Handle logout (accepts optional refresh token for simplejwt blacklisting).
      summary: Logout User
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/auth/me:
    get:
      operationId: auth_me_retrieve
      description: View to retrieve or update the authenticated user's profile.
      summary: Get current user details
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_me_update
      description: View to retrieve or update the authenticated user's profile.
      summary: Update current user details
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: View to retrieve or update the authenticated user's profile.
      summary: Partially update current user details
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/onboarding/complete:
    post:
      operationId: auth_onboarding_complete_create
      description: Create the first project from onboarding data and mark user onboarded.
      summary: Complete onboarding
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingComplete'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OnboardingComplete'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OnboardingComplete'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register:
    post:
      operationId: auth_register_create
      description: Handle user registration and generate tokens.
      summary: Register a new user
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/auth/reset-password:
    post:
      operationId: auth_reset_password_create
      description: Unsign and verify the token, then set user's password.
      summary: Reset password using token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPassword'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/credits:
    get:
      operationId: credits_retrieve
      description: GET /api/credits - current decimal Admart credit balance.
      tags:
      - credits
      responses:
        '200':
          description: No response body
  /api/credits/costs:
    get:
      operationId: credits_costs_retrieve
      description: GET /api/credits/costs - default/base model costs.
      tags:
      - credits
      responses:
        '200':
          description: No response body
  /api/credits/history:
    get:
      operationId: credits_history_retrieve
      description: GET /api/credits/history - recent image and video credit spends.
      tags:
      - credits
      responses:
        '200':
          description: No response body
  /api/credits/payments/methods:
    get:
      operationId: credits_payments_methods_retrieve
      description: GET /api/credits/payments/methods - manual payment instructions.
      tags:
      - credits
      responses:
        '200':
          description: No response body
  /api/credits/payments/mine:
    get:
      operationId: credits_payments_mine_retrieve
      description: GET /api/credits/payments/mine - the user's submitted payments.
      tags:
      - credits
      responses:
        '200':
          description: No response body
  /api/credits/payments/submit:
    post:
      operationId: credits_payments_submit_create
      description: POST /api/credits/payments/submit - upload EasyPaisa payment proof.
      tags:
      - credits
      responses:
        '200':
          description: No response body
  /api/credits/plans:
    get:
      operationId: credits_plans_retrieve
      description: GET /api/credits/plans - public Basic/Plus/Pro subscription plans.
      tags:
      - credits
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/credits/quote:
    post:
      operationId: credits_quote_create
      description: POST /api/credits/quote - estimate decimal credits before submit.
      tags:
      - credits
      responses:
        '200':
          description: No response body
  /api/fal/models:
    get:
      operationId: fal_models_retrieve
      tags:
      - fal
      responses:
        '200':
          description: No response body
  /api/images/models:
    get:
      operationId: images_models_retrieve
      tags:
      - images
      responses:
        '200':
          description: No response body
  /api/projects:
    get:
      operationId: projects_list
      description: Return the user's projects plus the resolved active project id.
      summary: List the current user's projects
      tags:
      - projects
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
          description: ''
    post:
      operationId: projects_create
      description: Create a project owned by the user and immediately make it active.
      summary: Create a project
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/projects/{id}:
    get:
      operationId: projects_retrieve
      description: Retrieve, partially update, or delete a single owned project.
      summary: Get a project
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    put:
      operationId: projects_update
      description: Retrieve, partially update, or delete a single owned project.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    patch:
      operationId: projects_partial_update
      description: Retrieve, partially update, or delete a single owned project.
      summary: Update a project
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProject'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProject'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProject'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    delete:
      operationId: projects_destroy
      description: Retrieve, partially update, or delete a single owned project.
      summary: Delete a project
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      responses:
        '204':
          description: No response body
  /api/projects/{id}/activate:
    post:
      operationId: projects_activate_create
      description: Set the project's last_accessed_at and the user's active pointer.
      summary: Activate a project
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      responses:
        '200':
          description: '{ "activeProjectId": "<id>" }'
  /api/projects/{project_id}/ads/accounts:
    get:
      operationId: projects_ads_accounts_retrieve
      description: Resolve and authorize the parent project for social-account endpoints.
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialAccount'
          description: ''
  /api/projects/{project_id}/ads/boost:
    post:
      operationId: projects_ads_boost_create
      description: POST /api/projects/:id/ads/boost
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialAccount'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SocialAccount'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SocialAccount'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialAccount'
          description: ''
  /api/projects/{project_id}/ads/connect/{provider}/url:
    get:
      operationId: projects_ads_connect_url_retrieve
      description: Resolve and authorize the parent project for social-account endpoints.
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - projects
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialAccount'
          description: ''
  /api/projects/{project_id}/ads/disconnect/{provider}:
    delete:
      operationId: projects_ads_disconnect_destroy
      description: Resolve and authorize the parent project for social-account endpoints.
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - projects
      responses:
        '204':
          description: No response body
  /api/projects/{project_id}/images/jobs:
    get:
      operationId: projects_images_jobs_retrieve
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      responses:
        '200':
          description: No response body
    post:
      operationId: projects_images_jobs_create
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      responses:
        '200':
          description: No response body
  /api/projects/{project_id}/images/jobs/{job_id}:
    get:
      operationId: projects_images_jobs_retrieve_2
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      responses:
        '200':
          description: No response body
  /api/projects/{project_id}/images/jobs/{job_id}/cancel:
    post:
      operationId: projects_images_jobs_cancel_create
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path

components:
  schemas:
    AuthResponse:
      type: object
      description: Schema for authentication responses containing tokens and user
        profile.
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - accessToken
      - refreshToken
      - user
    ConnectedPlatformsEnum:
      enum:
      - tiktok
      - youtube
      - instagram
      - facebook
      - snapchat
      type: string
      description: |-
        * `tiktok` - tiktok
        * `youtube` - youtube
        * `instagram` - instagram
        * `facebook` - facebook
        * `snapchat` - snapchat
    CustomTokenObtainPair:
      type: object
      description: Custom Token Obtain Pair Serializer that adds user profile to the
        response.
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    ForgotPassword:
      type: object
      description: Serializer for password reset request.
      properties:
        email:
          type: string
          format: email
      required:
      - email
    GoogleAuth:
      type: object
      description: Serializer for Google OAuth 2.0 code exchange (web) or id_token
        (mobile).
      properties:
        code:
          type: string
          default: ''
        redirectUri:
          type: string
          default: ''
        redirect_uri:
          type: string
          default: ''
        idToken:
          type: string
          default: ''
        id_token:
          type: string
          default: ''
        intent:
          type: string
          default: ''
        createAccount:
          type: boolean
          nullable: true
    Message:
      type: object
      description: Schema for generic API message responses.
      properties:
        message:
          type: string
      required:
      - message
    MethodEnum:
      enum:
      - manual
      - jazzcash
      - easypaisa
      - card
      - other
      type: string
      description: |-
        * `manual` - Manual
        * `jazzcash` - JazzCash
        * `easypaisa` - EasyPaisa
        * `card` - Card
        * `other` - Other
    OnboardingComplete:
      type: object
      description: Serializer for completing onboarding — saves platforms, brand info,
        and optional prompt.
      properties:
        connectedPlatforms:
          type: array
          items:
            $ref: '#/components/schemas/ConnectedPlatformsEnum'
        projectName:
          type: string
          default: ''
          maxLength: 80
        brandName:
          type: string
          default: ''
        industry:
          type: string
          default: ''
        brandColorHex:
          type: string
          default: '#2563eb'
        prompt:
          type: string
          default: ''
        template:
          type: string
          nullable: true
    PatchedProject:
      type: object
      description: |-
        Serializer for a Project in camelCase, matching the frontend shape.

        Exposes the per-project brand kit and accepts the snake_case brand fields the
        onboarding flow sends.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 80
          minLength: 1
        icon:
          type: string
          maxLength: 16
        color:
          type: string
          maxLength: 7
        org:
          type: string
          maxLength: 120
        brandKit:
          type: object
          additionalProperties: {}
          description: Return the project's brand kit dict.
          readOnly: true
        lastAccessedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        brand_name:
          type: string
          writeOnly: true
          maxLength: 255
        brand_industry:
          type: string
          writeOnly: true
          maxLength: 100
        brand_color_hex:
          type: string
          writeOnly: true
          maxLength: 7
        brand_logo_url:
          writeOnly: true
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 1000
          - type: string
            maxLength: 0
    PatchedUser:
      type: object
      description: |-
        Serializer representing the user profile in camelCase format.

        Accepts both camelCase and snake_case brand fields for write operations
        (the frontend onboarding sends snake_case: brand_name, brand_industry, brand_color_hex).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        firstName:
          type: string
        lastName:
          type: string
        avatarUrl:
          type: string
          format: uri
          nullable: true
        googleId:
          type: string
          nullable: true
        emailVerified:
          type: boolean
          readOnly: true
        plan:
          allOf:
          - $ref: '#/components/schemas/PlanEnum'
          readOnly: true
        creditsTotal:
          type: number
          format: double
          maximum: 1000000
          minimum: -1000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          readOnly: true
        creditsUsed:
          type: number
          format: double
          maximum: 1000000
          minimum: -1000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          readOnly: true
        creditsRemaining:
          type: number
          format: double
          maximum: 1000000
          minimum: -1000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          readOnly: true
        creditsResetAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        onboardingCompleted:
          type: boolean
          default: false
        planDetails:
          type: object
          additionalProperties: {}
          description: Return the public business plan details for the user.
          readOnly: true
        brandKit:
          type: object
          additionalProperties: {}
          description: Return the brand kit dict from the model property.
          readOnly: true
        projectCount:
          type: integer
          description: Number of projects the user owns (frontend routing signal).
          readOnly: true
        activeProjectId:
          type: string
          nullable: true
          description: Resolved active project id (explicit selection or most recent).
          readOnly: true
        isStaff:
          type: boolean
          readOnly: true
        isSuperuser:
          type: boolean
          readOnly: true
        lastActiveAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        brand_name:
          type: string
          maxLength: 255
        brand_industry:
          type: string
          maxLength: 100
        brand_color_hex:
          type: string
          maxLength: 7
    PaymentCreate:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          writeOnly: true
        email:
          type: string
          format: email
          writeOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        currency:
          type: string
          default: USD
          maxLength: 8
        method:
          allOf:
          - $ref: '#/components/schemas/MethodEnum'
          default: manual
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          default: paid
        providerRef:
          type: string
        notes:
          type: string
      required:
      - amount
    PlanEnum:
      enum:
      - free
      - basic
      - plus
      - pro
      type: string
      description: |-
        * `free` - Free
        * `basic` - Basic
        * `plus` - Plus
        * `pro` - Pro
    PlatformEnum:
      enum:
      - tiktok
      - youtube
      - instagram
      - facebook
      - snapchat
      type: string
      description: |-
        * `tiktok` - TikTok
        * `youtube` - YouTube
        * `instagram` - Instagram
        * `facebook` - Facebook
        * `snapchat` - Snapchat
    Project:
      type: object
      description: |-
        Serializer for a Project in camelCase, matching the frontend shape.

        Exposes the per-project brand kit and accepts the snake_case brand fields the
        onboarding flow sends.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 80
          minLength: 1
        icon:
          type: string
          maxLength: 16
        color:
          type: string
          maxLength: 7
        org:
          type: string
          maxLength: 120
        brandKit:
          type: object
          additionalProperties: {}
          description: Return the project's brand kit dict.
          readOnly: true
        lastAccessedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        brand_name:
          type: string
          writeOnly: true
          maxLength: 255
        brand_industry:
          type: string
          writeOnly: true
          maxLength: 100
        brand_color_hex:
          type: string
          writeOnly: true
          maxLength: 7
        brand_logo_url:
          writeOnly: true
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 1000
          - type: string
            maxLength: 0
      required:
      - brandKit
      - createdAt
      - id
      - lastAccessedAt
      - name
      - updatedAt
    Register:
      type: object
      description: Serializer for registering a new user on the free plan.
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
        firstName:
          type: string
        lastName:
          type: string
      required:
      - email
      - password
    ResetPassword:
      type: object
      description: Serializer for resetting password using a secure token.
      properties:
        token:
          type: string
        newPassword:
          type: string
          writeOnly: true
      required:
      - newPassword
      - token
    SocialAccount:
      type: object
      description: Serializer for a connected social media account scoped to a project.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        projectId:
          type: string
          format: uuid
          readOnly: true
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        handle:
          type: string
          maxLength: 255
        displayName:
          type: string
        connected:
          type: boolean
        avatarUrl:
          type: string
          format: uri
          nullable: true
        tokenExpiresAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - createdAt
      - id
      - platform
      - projectId
      - tokenExpiresAt
    StatusEnum:
      enum:
      - paid
      - pending
      - failed
      - refunded
      type: string
      description: |-
        * `paid` - Paid
        * `pending` - Pending
        * `failed` - Failed
        * `refunded` - Refunded
    TokenRefresh:
      type: object

# /etc/nginx/sites-available/admart  (then: ln -s ../sites-available/admart /etc/nginx/sites-enabled/)
# Replace api-staging.example.com / staging.example.com with your domains, then run
#   certbot --nginx -d staging.example.com -d api-staging.example.com
# which adds TLS and the http->https redirect.

# ---- API (Django via gunicorn) ----
server {
    listen 80;
    server_name api-staging.example.com;

    client_max_body_size 210m;        # library video uploads are up to 200 MB

    location /static/ {
        alias /srv/admart/backend/staticfiles/;
        add_header X-Content-Type-Options nosniff always;
        expires 7d;
    }

    # Public user media (generated images/videos, uploads; fal and Instagram fetch these).
    # Sandboxed: even a file that slipped through can't run script on this domain.
    location /media/ {
        alias /srv/admart/backend/media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    # private_media/ (payment proofs) is deliberately NOT exposed here.
    # Optional: restrict the Django admin to your own IP(s).
    # location /admin/ { allow 203.0.113.10; deny all; proxy_pass http://127.0.0.1:8001; include /etc/nginx/proxy_params; proxy_set_header X-Forwarded-Proto $scheme; }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 660s;          # publish uploads can take up to 600s
    }
}

# ---- Frontend (static Vite build) ----
server {
    listen 80;
    server_name staging.example.com;
    root /srv/admart/frontend;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Only our own bundled scripts may run: injected <script>/inline JS is blocked, which
    # is what keeps the localStorage login tokens safe if an XSS bug ever slips in.
    # Images/media/downloads may come from any https host (API media, fal CDN, avatars).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://api-staging.example.com https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri /index.html;   # React Router routes
    }
}

# Local development: Postgres, Redis, Django, Celery worker, Celery Beat and the frontend.
#   ./dev.sh            (start everything; code changes reload automatically)
#   ./dev.sh down       (stop)
# Expects the frontend repo next to this one: ../Admart-frontend. Details: docs/docker.md

name: admart

x-backend: &backend
  build:
    context: .
    target: dev
  image: admart-backend:dev
  user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"  # files written to media/ stay yours (dev.sh sets these)
  env_file: .env
  environment:
    POSTGRES_DB: admart
    POSTGRES_USER: admart
    POSTGRES_PASSWORD: admart
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    USE_CELERY: "True"
    CORS_ORIGINS: "http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}"
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: admart
      POSTGRES_USER: admart
      POSTGRES_PASSWORD: admart
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admart -d admart"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  # Celery restarts by itself when backend Python files change (watchmedo).
  worker:
    <<: *backend
    command: >-
      watchmedo auto-restart --recursive --pattern=*.py
      -d agents -d content -d projects -d users -d config -d blog -d admin_panel --
      celery -A config worker --loglevel=info --concurrency=2

  beat:
    <<: *backend
    command: >-
      watchmedo auto-restart --recursive --pattern=*.py -d config --
      celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  frontend:
    build:
      context: ../Admart-frontend
      target: dev
    image: admart-frontend:dev
    volumes:
      - ../Admart-frontend:/app
      - /app/node_modules  # the image's node_modules, not the host's
    environment:
      VITE_API_URL: "http://localhost:${BACKEND_PORT:-8000}"  # the browser reaches the web container here
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
